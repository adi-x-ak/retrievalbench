[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievalbench-lab"
version = "0.1.0"
description = "Development-calibrated hybrid retrieval with a frozen BEIR evaluation."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyStemmer>=2.2", "pytrec-eval-terrier>=0.5.6"]

[project.optional-dependencies]
models = ["torch>=2.8,<3", "transformers>=5.19,<6"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
retrievalbench = "retrievalbench.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
